# Локальный микрофон-relay Bumi открывается в iframe с http://corpms.local.
# Глобальный макрос OSPanel ставит X-Frame-Options: SAMEORIGIN для всех хостов;
# CSP frame-ancestors из SecurityHeaders.php уже ограничивает родителя белым
# списком, поэтому для relay-ответа старый XFO нужно снять.
# Symfony-слой сам снимает XFO только на /bumi/voice/relay и ставит его на
# остальные ответы, поэтому на уровне Apache достаточно безусловно убрать свою копию:
# дублирующий XFO ломает легальный localhost-iframe.
<IfModule mod_headers.c>
    Header always unset X-Frame-Options
</IfModule>
