name: CorpMS checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, mysql]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testing-only-password
          MYSQL_DATABASE: corpms_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptesting-only-password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: ${{ matrix.database }}
      DB_DATABASE: ${{ matrix.database == 'mysql' && 'corpms_test' || ':memory:' }}
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: testing-only-password
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      AI_BASE_URL: ''
      AI_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, pdo_mysql, dom, xml, xmlwriter, zip
          coverage: pcov
      - run: composer install --no-interaction --prefer-dist
      - name: PHP syntax
        run: rg --files app routes config database tests bootstrap -g '*.php' | xargs -n 1 php -l
      - name: Fresh database schema
        run: php artisan migrate:fresh --force --no-interaction
      - run: |
          rm -f .phpunit.result.cache
          php vendor/phpunit/phpunit/phpunit --do-not-cache-result \
            --log-junit storage/logs/ci-tests.xml \
            --coverage-clover storage/logs/coverage.xml
      - name: Coverage threshold
        env:
          COVERAGE_MIN: '30'
        run: php tools/verify-coverage.php storage/logs/coverage.xml
      - name: Concurrent database operations
        if: matrix.database == 'mysql'
        run: php tools/verify-concurrency.php
      - name: Text and layout structure
        shell: pwsh
        run: |
          ./tools/verify-encoding.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tools/verify-layout.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.database }}
          path: |
            storage/logs/ci-tests.xml
            storage/logs/coverage.xml
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - name: Pint (no new violations)
        run: php tools/verify-pint-baseline.php
      - name: PHP syntax
        run: rg --files app routes config database tests bootstrap tools -g '*.php' | xargs -n 1 php -l
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Ensure lockfile is committed
        run: |
          if [ ! -f package-lock.json ]; then
            echo "package-lock.json отсутствует — генерируем для этого прогона; закоммитьте его в репозиторий"
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          fi
      - run: npm ci
      - run: npm run build
      - name: npm audit
        run: npm audit --audit-level=high
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - run: composer audit --locked
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      PHP_BINARY: php
      AI_BASE_URL: ''
      AI_API_KEY: ''
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, dom, xml, zip, opcache
          coverage: none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: composer install --no-interaction --prefer-dist
      - run: python -m pip install -r tools/requirements-qa.txt
      - run: python -m playwright install --with-deps chromium
      - name: Browser, accessibility and local HTTP load
        run: |
          fixture=$(php tools/acceptance-environment.php)
          python tools/verify-browser.py "$fixture" --load
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-acceptance
          path: storage/logs/browser-acceptance/
